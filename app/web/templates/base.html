<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Speedwatch{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    /* ── Base ── */
    body { background:#111; color:#e0e0e0; }

    /* ── Bootstrap text utilities assume light bg — override for dark theme ── */
    .text-muted    { color:#8a8aaa !important; }
    .text-secondary{ color:#8a8aaa !important; }
    .text-dark     { color:#e0e0e0 !important; }
    .text-body     { color:#e0e0e0 !important; }

    /* ── Navbar ── */
    .navbar { background:#1a1a2e !important; }
    .navbar-brand { color:#4fc3f7 !important; font-weight:700; letter-spacing:1px; }
    .nav-link { color:#9090b0 !important; }
    .nav-link:hover, .nav-link.active { color:#4fc3f7 !important; }

    /* ── Cards ── */
    .card { background:#1e1e2e; border:1px solid #333; }
    .card-header { background:#252538; color:#c0c0d8; border-bottom:1px solid #333; }

    /* ── Tables ── */
    .table { color:#d8d8e8; }
    .table > :not(caption) > * > * { background:transparent; color:inherit; border-color:#2e2e44; }
    .table-hover tbody tr:hover > * { background:#252538 !important; color:#e8e8f8; }
    .table-dark { background:#13132a; color:#d0d0e8; }
    .table-dark th { border-color:#333; }

    /* ── Alerts ── */
    .alert-warning  { background:#2a2000; border-color:#554400; color:#d8b840; }
    .alert-secondary{ background:#1e1e30; border-color:#333; color:#9090b0; }
    .alert-danger   { background:#2a0d0d; border-color:#551111; color:#d87070; }
    .alert-success  { background:#0d2a14; border-color:#115520; color:#60c878; }
    .alert-info     { background:#0d2030; border-color:#114455; color:#60b8d8; }

    /* ── Form controls ── */
    .form-control, .form-select {
      background:#252538; color:#e0e0e0; border-color:#444;
    }
    .form-control:focus, .form-select:focus {
      background:#252538; color:#e0e0e0; border-color:#4fc3f7; box-shadow:none;
    }
    .form-control::placeholder { color:#6060808; }
    .form-label { color:#b0b0c8; }

    /* ── Badges ── */
    .badge-label-sw_ok    { background:#1a6e28; color:#fff; }
    .badge-label-sw_wrong { background:#7a1515; color:#fff; }
    .badge-label-unsure   { background:#6a5a00; color:#fff; }

    /* conf-badge: explicit text colors so bg-warning isn't light-on-light */
    .conf-badge {
      font-size:.75rem; font-weight:600; padding:.2em .5em; border-radius:.3em;
    }
    .conf-badge.bg-success  { color:#fff; }
    .conf-badge.bg-warning  { color:#111; }   /* yellow bg needs dark text */
    .conf-badge.bg-danger   { color:#fff; }
    .conf-badge.bg-secondary{ color:#e0e0e0; }

    /* Bootstrap badge defaults white text but dark-bg badges look black-on-black */
    .badge.bg-secondary { color:#e0e0e0; }

    /* ── Pagination ── */
    .page-link { background:#1e1e2e; border-color:#333; color:#4fc3f7; }
    .page-link:hover { background:#252538; color:#80d8ff; border-color:#444; }
    .page-item.disabled .page-link { background:#181828; color:#555; border-color:#2a2a3a; }
    .page-item.active .page-link { background:#4fc3f7; border-color:#4fc3f7; color:#111; }

    /* ── Buttons ── */
    .btn-check + .btn-outline-success { color:#60c878; border-color:#1a6e28; }
    .btn-check:checked + .btn-outline-success { background:#1a6e28; color:#fff; border-color:#1a6e28; }
    .btn-check + .btn-outline-danger { color:#d87070; border-color:#7a1515; }
    .btn-check:checked + .btn-outline-danger { background:#7a1515; color:#fff; border-color:#7a1515; }
    .btn-check + .btn-outline-warning { color:#d8b840; border-color:#6a5a00; }
    .btn-check:checked + .btn-outline-warning { background:#6a5a00; color:#fff; border-color:#6a5a00; }

    /* ── Misc ── */
    .thumb img { width:96px; height:54px; object-fit:cover; border-radius:4px; }
    a { color:#4fc3f7; }
    a:hover { color:#80d8ff; }
    code { color:#80cbc4; }
    video { border-radius:4px; }
    .table td, .table th { vertical-align:middle; }
    h5, h6 { color:#d0d0e8; }
    small, .small { color:#9090b0; }
    .fw-bold { color:#e8e8f8; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark mb-3">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Speedwatch v2</a>
    <div class="d-flex gap-3 align-items-center">
      <a href="/" class="nav-link small">Passes</a>
      <a href="/vehicles" class="nav-link small">Vehicles</a>
      <a href="/review" class="nav-link small">Review</a>
      <a href="/evidence" class="nav-link small">🚨 Evidence</a>
      <a href="/calibrate" class="nav-link small">Calibrate</a>
      {% if queue_size is defined and queue_size %}
      <span class="badge bg-warning text-dark">{{ queue_size }} queued</span>
      {% endif %}
    </div>
  </div>
</nav>
<div class="container-fluid px-4">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
