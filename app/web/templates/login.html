<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Speedwatch</title>
  <style>
    html { background:#111; }
    body { font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:#e0e0e0;
      display:flex; min-height:100vh; align-items:center; justify-content:center; margin:0; }
    .card { background:#1e1e2e; border:1px solid #2a2a3a; border-radius:.75rem;
      padding:2.5rem 2.75rem; text-align:center; max-width:360px; width:100%; }
    .brand { color:#4fc3f7; font-weight:700; font-size:1.6rem; letter-spacing:.5px; margin-bottom:.25rem; }
    .sub { color:#8a8aaa; font-size:.85rem; margin-bottom:1.75rem; }
    .gbtn { display:inline-flex; align-items:center; gap:.6rem; background:#fff; color:#1f1f1f;
      border:none; border-radius:.4rem; padding:.65rem 1.1rem; font-size:.95rem; font-weight:600;
      text-decoration:none; cursor:pointer; }
    .gbtn:hover { background:#f1f1f1; }
    .err { background:#2a0d0d; border:1px solid #551111; color:#d87070; border-radius:.4rem;
      padding:.6rem .8rem; font-size:.82rem; margin-bottom:1.25rem; }
    .g { width:18px; height:18px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">⏱ speedwatch</div>
    <div class="sub">Sign in to continue</div>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <a class="gbtn" href="/auth/login">
      <svg class="g" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Sign in with Google
    </a>
  </div>
</body>
</html>
