<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="560" height="140" role="img" aria-label="speedwatch">
  <title>speedwatch</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#80d8ff"/>
      <stop offset="1" stop-color="#2b9fd6"/>
    </linearGradient>
  </defs>

  <!-- motion streaks (speed) -->
  <g stroke="#4fc3f7" stroke-width="4" stroke-linecap="round">
    <line x1="2"  y1="66" x2="20" y2="66" opacity="0.30"/>
    <line x1="0"  y1="78" x2="22" y2="78" opacity="0.55"/>
    <line x1="2"  y1="90" x2="20" y2="90" opacity="0.30"/>
  </g>

  <!-- stopwatch crown -->
  <rect x="58" y="20" width="16" height="9" rx="3" fill="url(#ring)"/>
  <rect x="63" y="28" width="6" height="7" rx="2" fill="url(#ring)"/>

  <!-- watch face -->
  <circle cx="66" cy="80" r="40" fill="#15151f" stroke="url(#ring)" stroke-width="6"/>
  <!-- tick marks -->
  <circle cx="66" cy="80" r="31" fill="none" stroke="#4fc3f7" stroke-width="5"
          stroke-dasharray="1.6 8.1" opacity="0.85"/>

  <!-- speed needle -->
  <line x1="66" y1="80" x2="58" y2="89" stroke="#e6f7ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="66" y1="80" x2="93" y2="55" stroke="#e6f7ff" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="66" cy="80" r="5.5" fill="#e6f7ff"/>

  <!-- wordmark -->
  <text x="138" y="92" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="52" font-weight="700" letter-spacing="0.5">
    <tspan fill="#d7e2f0">speed</tspan><tspan fill="#4fc3f7">watch</tspan>
  </text>
  <text x="140" y="116" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="15" fill="#8a8aaa" letter-spacing="0.3">
    self-hosted vehicle speed detection &amp; ANPR
  </text>
</svg>
